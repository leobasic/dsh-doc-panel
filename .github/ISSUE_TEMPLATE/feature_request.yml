name: Feature request
description: Suggest a capability or an improvement to the panel
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem you are trying to solve rather than only the UI you
        have in mind. **Do not include real conversation titles, paths, or unmasked screenshots.**

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      render: text

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard / layout
        - Index and attribution (which conversation a document belongs to)
        - Previews (Markdown / HTML / PDF / Office)
        - Favorites
        - Search
        - Configuration
        - Docs
        - Other
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed real conversation titles, file paths, document contents, and unmasked screenshots from this request.
          required: true
