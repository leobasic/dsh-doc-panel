name: Bug report
description: Report something that is broken or behaves unexpectedly
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not include real conversation titles, absolute paths,
        document contents, or unmasked screenshots** — this plugin reads your local
        conversation history and workspace. Redact or replace them with placeholders.

  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      description: Shown in the app (and available in `runtime.json` of your installation).
      placeholder: e.g. 0.2.2-rc.1
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: dsh-doc-panel version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 15
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the documents panel
        2. Click a conversation folder
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Screenshots are welcome if names and paths are masked.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: |
        Client errors from the Web developer console, or the output of the plugin's
        diagnostics route (`POST api/dsh-doc-panel/diag`), with private paths removed.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed real conversation titles, file paths, document contents, and unmasked screenshots from this report.
          required: true
